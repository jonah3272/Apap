name: Publish APAPSIF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  domain-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public DNS and website responses
        run: |
          python3 - <<'PY'
          import json,re,socket,urllib.request
          for host,types in [('apapsif.com',['NS','A','AAAA']),('www.apapsif.com',['CNAME','A','AAAA'])]:
              for kind in types:
                  try:
                      with urllib.request.urlopen('https://dns.google/resolve?name='+host+'&type='+kind,timeout=10) as r:
                          answer=json.load(r)
                      print(json.dumps({'host':host,'record':kind,'dns_status':answer.get('Status'),'answer':answer.get('Answer',[])},ensure_ascii=False))
                  except Exception as e:
                      print(json.dumps({'host':host,'record':kind,'error':str(e)}))
              for scheme in ['http','https']:
                  url=scheme+'://'+host+'/'
                  try:
                      with urllib.request.urlopen(url,timeout=15) as r:
                          body=r.read(500000).decode('utf-8','replace')
                          print(json.dumps({'requested':url,'url':r.url,'status':r.status,'server':r.headers.get('server'),'github_request':r.headers.get('x-github-request-id'),'apapsif_content':'Asociación Panameña' in body,'canonical':re.findall(r'<link[^>]*rel="canonical"[^>]*>',body)},ensure_ascii=False))
                  except Exception as e:
                      print(json.dumps({'requested':url,'error':str(e)}))
          PY
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read the configured Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Spanish site and validate links and metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build_github_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report custom domain and HTTPS certificate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/pages"
          --jq '{domain: .cname, url: .html_url, https_enforced: .https_enforced, certificate: .https_certificate}'
